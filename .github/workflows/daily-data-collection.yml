name: Daily Data Collection

on:
  # Triggered by cron-job.org via workflow_dispatch at 09:35 JST.
  workflow_dispatch: {}

concurrency:
  group: data-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      YFINANCE_SERVICE_URL: http://127.0.0.1:8766
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: yfinance-service/requirements.txt

      - name: Install Node deps
        run: npm ci

      - name: Install Python deps
        working-directory: yfinance-service
        run: pip install -r requirements.txt

      - name: Prisma generate
        run: npx prisma generate

      - name: Start yfinance-service (background)
        working-directory: yfinance-service
        run: |
          nohup python main.py > /tmp/sidecar.log 2>&1 &
          echo $! > /tmp/sidecar.pid
          for i in {1..20}; do
            if curl -sf http://127.0.0.1:8766/health > /dev/null; then
              echo "sidecar healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "sidecar health check failed"
          cat /tmp/sidecar.log || true
          exit 1

      - name: Run data collection
        run: npx tsx scripts/daily-data-collection.ts

      - name: Stop sidecar
        if: always()
        run: |
          if [ -f /tmp/sidecar.pid ]; then
            kill "$(cat /tmp/sidecar.pid)" 2>/dev/null || true
          fi

      - name: Slack notify on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" '{text: ("⚠️ Daily data collection FAILED. Check: " + $url)}')" \
            "$SLACK_WEBHOOK_URL"
