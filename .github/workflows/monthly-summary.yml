name: Monthly Operations Summary

on:
  # Native schedule (not cron-job.org): a 0-3h delay is fine for a monthly
  # informational run, same rationale as weekly-compare.yml.
  schedule:
    - cron: "30 1 1 * *"  # 1st of month 01:30 UTC = 10:30 JST
  workflow_dispatch:
    inputs:
      month:
        description: "Target month (YYYY-MM). Empty = previous month."
        required: false
        default: ""

concurrency:
  group: monthly-summary
  cancel-in-progress: false

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node deps
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Run monthly-summary
        run: |
          MONTH_ARG=""
          if [ -n "${{ github.event.inputs.month }}" ]; then
            MONTH_ARG="--month=${{ github.event.inputs.month }}"
          fi
          npx tsx scripts/monthly-summary.ts $MONTH_ARG | tee /tmp/monthly-summary.txt

      - name: Send Slack notification
        if: success() && env.SLACK_WEBHOOK_URL != ''
        run: |
          {
            echo "🗓️ *Monthly Operations Summary*"
            echo ""
            cat /tmp/monthly-summary.txt
          } > /tmp/slack-text.txt
          jq -nc --rawfile text /tmp/slack-text.txt '{text: $text}' > /tmp/slack-payload.json
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data @/tmp/slack-payload.json \
            "$SLACK_WEBHOOK_URL"

      - name: Slack notify on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" '{text: ("⚠️ Monthly summary FAILED. Check: " + $url)}')" \
            "$SLACK_WEBHOOK_URL"
