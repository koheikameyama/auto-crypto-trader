name: Manual Backfill (one-shot setup)

on:
  workflow_dispatch:
    inputs:
      backfill_years:
        description: "Years to backfill (crypto/onchain; macro/funding is fixed by source)"
        required: false
        default: "10"
        type: string
      run_crypto:
        description: "Run backfill-crypto-prices"
        required: false
        default: true
        type: boolean
      run_onchain:
        description: "Run backfill-onchain-metrics (BTC only)"
        required: false
        default: true
        type: boolean
      run_macro:
        description: "Run backfill-macro (DXY, VIX, TNX)"
        required: false
        default: true
        type: boolean
      run_btc_funding:
        description: "Run backfill-funding-rate (BTCUSDT)"
        required: false
        default: true
        type: boolean
      run_eth_funding:
        description: "Run backfill-eth-funding (ETHUSDT)"
        required: false
        default: true
        type: boolean

concurrency:
  group: backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      YFINANCE_SERVICE_URL: http://127.0.0.1:8766

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: yfinance-service/requirements.txt

      - name: Install Node deps
        run: npm ci

      - name: Install Python deps
        working-directory: yfinance-service
        run: pip install -r requirements.txt

      - name: Prisma generate + migrate deploy
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Start yfinance-service (background)
        working-directory: yfinance-service
        run: |
          nohup python main.py > /tmp/sidecar.log 2>&1 &
          echo $! > /tmp/sidecar.pid
          for i in {1..20}; do
            if curl -sf http://127.0.0.1:8766/health > /dev/null; then
              echo "sidecar healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "sidecar health check failed"
          cat /tmp/sidecar.log || true
          exit 1

      - name: Backfill crypto prices
        if: ${{ inputs.run_crypto == true || inputs.run_crypto == 'true' }}
        run: npx tsx scripts/backfill-crypto-prices.ts --years=${{ inputs.backfill_years }}

      - name: Backfill onchain metrics
        if: ${{ inputs.run_onchain == true || inputs.run_onchain == 'true' }}
        run: npx tsx scripts/backfill-onchain-metrics.ts --years=${{ inputs.backfill_years }}

      - name: Backfill macro (DXY / VIX / TNX)
        if: ${{ inputs.run_macro == true || inputs.run_macro == 'true' }}
        run: npx tsx scripts/backfill-macro.ts

      - name: Backfill BTC funding rate
        if: ${{ inputs.run_btc_funding == true || inputs.run_btc_funding == 'true' }}
        run: npx tsx scripts/backfill-funding-rate.ts

      - name: Backfill ETH funding rate
        if: ${{ inputs.run_eth_funding == true || inputs.run_eth_funding == 'true' }}
        run: npx tsx scripts/backfill-eth-funding.ts

      - name: Stop sidecar
        if: always()
        run: |
          if [ -f /tmp/sidecar.pid ]; then
            kill "$(cat /tmp/sidecar.pid)" 2>/dev/null || true
          fi

      - name: Summary
        if: success()
        run: |
          echo "### Backfill complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Run daily-live-run manually once to populate LivePositionLog/VirtualPortfolioState:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo 'gh workflow run "Daily Live Run (Scheme E)"' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
