name: Daily Live Run (Scheme E)

on:
  schedule:
    # Daily 00:05 UTC = 09:05 JST
    - cron: "5 0 * * *"
  workflow_dispatch: {}

concurrency:
  group: live-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      YFINANCE_SERVICE_URL: http://127.0.0.1:8766
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      GMO_API_KEY: ${{ secrets.GMO_API_KEY }}
      GMO_API_SECRET: ${{ secrets.GMO_API_SECRET }}
      EXECUTION_ENABLED: ${{ secrets.EXECUTION_ENABLED }}
      EXECUTION_ASSETS: ${{ secrets.EXECUTION_ASSETS }}
      HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: yfinance-service/requirements.txt

      - name: Install Node deps
        run: npm ci

      - name: Install Python deps
        working-directory: yfinance-service
        run: pip install -r requirements.txt

      - name: Prisma generate + migrate deploy
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Start yfinance-service (background)
        working-directory: yfinance-service
        run: |
          nohup python main.py > /tmp/sidecar.log 2>&1 &
          echo $! > /tmp/sidecar.pid
          for i in {1..20}; do
            if curl -sf http://127.0.0.1:8766/health > /dev/null; then
              echo "sidecar healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "sidecar health check failed"
          cat /tmp/sidecar.log || true
          exit 1

      - name: Run rebalance (BTC-USD)
        run: npx tsx scripts/live-rebalance.ts --asset=BTC-USD --initial-capital=10000

      - name: Run rebalance (ETH-USD)
        run: npx tsx scripts/live-rebalance.ts --asset=ETH-USD --initial-capital=10000

      - name: Run actual execution (GMO, Phase 2)
        if: env.EXECUTION_ENABLED == 'true' && env.GMO_API_KEY != ''
        run: |
          ASSETS="${EXECUTION_ASSETS:-BTC}"
          IFS=',' read -r -a ASSET_ARR <<< "$ASSETS"
          for A in "${ASSET_ARR[@]}"; do
            A="$(echo "$A" | tr -d '[:space:]')"
            echo "--- $A (Actual, GMO) ---"
            npx tsx scripts/live-execute.ts --asset="$A" || echo "live-execute failed for $A (continuing)"
          done

      - name: Stop sidecar
        if: always()
        run: |
          if [ -f /tmp/sidecar.pid ]; then
            kill "$(cat /tmp/sidecar.pid)" 2>/dev/null || true
          fi

      - name: Build Slack notification
        if: success() && env.SLACK_WEBHOOK_URL != ''
        id: slack-body
        run: |
          DATE="$(date -u +%Y-%m-%d)"
          BTC_JSON="reports/live/${DATE}-BTC-USD-portfolio.json"
          ETH_JSON="reports/live/${DATE}-ETH-USD-portfolio.json"
          BTC_ACTUAL_JSON="reports/live/${DATE}-BTC-actual.json"
          ETH_ACTUAL_JSON="reports/live/${DATE}-ETH-actual.json"

          build_virtual_section() {
            local label="$1" file="$2"
            if [ ! -f "$file" ]; then
              echo "*${label}*"
              echo "(no report file)"
              return
            fi
            local price target equity cumret rebalanced fee
            price=$(jq -r '.price' "$file")
            target=$(jq -r '.signal.targetPosition' "$file")
            equity=$(jq -r '.portfolio.equityUsd' "$file")
            cumret=$(jq -r '.cumulative.return' "$file")
            rebalanced=$(jq -r '.portfolio.rebalancedToday' "$file")
            fee=$(jq -r '.portfolio.feeUsd' "$file")
            local reb_emoji="—"
            [ "$rebalanced" = "true" ] && reb_emoji="✅"
            printf '*%s (Virtual)*\n' "$label"
            printf '• Price: $%.2f\n' "$price"
            printf '• Target: %.1f%% long\n' "$(echo "$target * 100" | bc -l)"
            printf '• Equity: $%.2f (%+.2f%%)\n' "$equity" "$(echo "$cumret * 100" | bc -l)"
            printf '• Rebalanced: %s (fee $%.2f)\n' "$reb_emoji" "$fee"
          }

          build_actual_section() {
            local label="$1" file="$2"
            if [ ! -f "$file" ]; then
              return
            fi
            local target equity cumret rebalanced fee slippage delta units position
            target=$(jq -r '.signal.targetPosition' "$file")
            equity=$(jq -r '.portfolio.equityJpy' "$file")
            cumret=$(jq -r '.cumulative.return' "$file")
            rebalanced=$(jq -r '.portfolio.rebalancedToday' "$file")
            fee=$(jq -r '.portfolio.feeJpy' "$file")
            slippage=$(jq -r '.portfolio.slippageBps' "$file")
            delta=$(jq -r '.portfolio.rebalanceDelta' "$file")
            units=$(jq -r '.portfolio.units' "$file")
            position=$(jq -r '.portfolio.actualPosition' "$file")

            printf '*%s (Actual, GMO)*\n' "$label"
            printf '• Target: %.1f%% long\n' "$(echo "$target * 100" | bc -l)"
            printf '• Position: %s (%.1f%%)\n' "$units" "$(echo "$position * 100" | bc -l)"
            printf '• Equity: ¥%.0f (%+.2f%%)\n' "$equity" "$(echo "$cumret * 100" | bc -l)"
            if [ "$rebalanced" = "true" ]; then
              local side qty
              if [ "$(echo "$delta > 0" | bc -l)" = "1" ]; then
                side="🟢 BUY"
                qty=$delta
              else
                side="🔴 SELL"
                qty=$(echo "$delta * -1" | bc -l)
              fi
              printf '• Rebalanced: ✅ %s %s %s (fee ¥%.2f, slip %.1fbps)\n' "$side" "$qty" "$label" "$fee" "$slippage"
            else
              printf '• Rebalanced: —\n'
            fi
          }

          {
            echo "📊 *Scheme E Daily Run* — ${DATE}"
            echo ""
            build_virtual_section "BTC-USD" "$BTC_JSON"
            if [ -f "$BTC_ACTUAL_JSON" ]; then
              echo ""
              build_actual_section "BTC" "$BTC_ACTUAL_JSON"
            fi
            echo ""
            build_virtual_section "ETH-USD" "$ETH_JSON"
            if [ -f "$ETH_ACTUAL_JSON" ]; then
              echo ""
              build_actual_section "ETH" "$ETH_ACTUAL_JSON"
            fi
          } > /tmp/slack-text.txt

          # Emit payload for Slack (plain text channel message)
          jq -nc --rawfile text /tmp/slack-text.txt '{text: $text}' > /tmp/slack-payload.json
          echo "payload_file=/tmp/slack-payload.json" >> "$GITHUB_OUTPUT"

      - name: Send Slack notification (success)
        if: success() && env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data @"${{ steps.slack-body.outputs.payload_file }}" \
            "$SLACK_WEBHOOK_URL"

      - name: Send Slack notification (failure)
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" '{text: ("⚠️ Scheme E daily run FAILED. Check logs: " + $url)}')" \
            "$SLACK_WEBHOOK_URL"

      - name: Ping healthchecks (success)
        if: success() && env.HEALTHCHECKS_URL != ''
        run: curl -fsS --retry 3 "$HEALTHCHECKS_URL" > /dev/null

      - name: Ping healthchecks (failure)
        if: failure() && env.HEALTHCHECKS_URL != ''
        run: curl -fsS --retry 3 "$HEALTHCHECKS_URL/fail" > /dev/null

      - name: Upload JSON reports as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-reports-${{ github.run_id }}
          path: reports/live/
          if-no-files-found: ignore
          retention-days: 30
