name: Daily Live Run (Scheme E)

on:
  schedule:
    # Daily 00:05 UTC = 09:05 JST
    - cron: "5 0 * * *"
  workflow_dispatch: {}

concurrency:
  group: live-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      YFINANCE_SERVICE_URL: http://127.0.0.1:8766
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: yfinance-service/requirements.txt

      - name: Install Node deps
        run: npm ci

      - name: Install Python deps
        working-directory: yfinance-service
        run: pip install -r requirements.txt

      - name: Prisma generate + migrate deploy
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Start yfinance-service (background)
        working-directory: yfinance-service
        run: |
          nohup python main.py > /tmp/sidecar.log 2>&1 &
          echo $! > /tmp/sidecar.pid
          for i in {1..20}; do
            if curl -sf http://127.0.0.1:8766/health > /dev/null; then
              echo "sidecar healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "sidecar health check failed"
          cat /tmp/sidecar.log || true
          exit 1

      - name: Run rebalance (BTC-USD)
        run: npx tsx scripts/live-rebalance.ts --asset=BTC-USD --initial-capital=10000

      - name: Run rebalance (ETH-USD)
        run: npx tsx scripts/live-rebalance.ts --asset=ETH-USD --initial-capital=10000

      - name: Stop sidecar
        if: always()
        run: |
          if [ -f /tmp/sidecar.pid ]; then
            kill "$(cat /tmp/sidecar.pid)" 2>/dev/null || true
          fi

      - name: Build Slack notification
        if: success() && env.SLACK_WEBHOOK_URL != ''
        id: slack-body
        run: |
          DATE="$(date -u +%Y-%m-%d)"
          BTC_JSON="reports/live/${DATE}-BTC-USD-portfolio.json"
          ETH_JSON="reports/live/${DATE}-ETH-USD-portfolio.json"

          build_asset_section() {
            local label="$1" file="$2"
            if [ ! -f "$file" ]; then
              echo "*${label}*"
              echo "(no report file)"
              return
            fi
            local price target equity cumret rebalanced fee
            price=$(jq -r '.price' "$file")
            target=$(jq -r '.signal.targetPosition' "$file")
            equity=$(jq -r '.portfolio.equityUsd' "$file")
            cumret=$(jq -r '.cumulative.return' "$file")
            rebalanced=$(jq -r '.portfolio.rebalancedToday' "$file")
            fee=$(jq -r '.portfolio.feeUsd' "$file")
            local reb_emoji="❌"
            [ "$rebalanced" = "true" ] && reb_emoji="✅"
            printf '*%s*\n' "$label"
            printf '• Price: $%.2f\n' "$price"
            printf '• Target: %.1f%% long\n' "$(echo "$target * 100" | bc -l)"
            printf '• Equity: $%.2f (%+.2f%%)\n' "$equity" "$(echo "$cumret * 100" | bc -l)"
            printf '• Rebalanced: %s (fee $%.2f)\n' "$reb_emoji" "$fee"
          }

          {
            echo "📊 *Scheme E Daily Run* — ${DATE}"
            echo ""
            build_asset_section "BTC-USD" "$BTC_JSON"
            echo ""
            build_asset_section "ETH-USD" "$ETH_JSON"
          } > /tmp/slack-text.txt

          # Emit payload for Slack (plain text channel message)
          jq -nc --rawfile text /tmp/slack-text.txt '{text: $text}' > /tmp/slack-payload.json
          echo "payload_file=/tmp/slack-payload.json" >> "$GITHUB_OUTPUT"

      - name: Send Slack notification (success)
        if: success() && env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data @"${{ steps.slack-body.outputs.payload_file }}" \
            "$SLACK_WEBHOOK_URL"

      - name: Send Slack notification (failure)
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" '{text: ("⚠️ Scheme E daily run FAILED. Check logs: " + $url)}')" \
            "$SLACK_WEBHOOK_URL"

      - name: Upload JSON reports as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-reports-${{ github.run_id }}
          path: reports/live/
          if-no-files-found: ignore
          retention-days: 30
